name: Polish Beyond Token Time reader copy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/polish-btt-reader.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove revision-aware wording from reader-facing copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'research/beyond-token-time/content-ko.html': [
              ('핵심 가설은 새로운 hidden-thinking 기법 하나가 아니다. 지능의 내부 표현과 외부 인터페이스를 분리하고, 필요할 때만 discrete token·fixed clock·named modality로 투영하는 것이 더 자연스러운 계산 구조일 수 있다는 것이다.',
               '핵심 가설은 지능의 내부 표현과 외부 인터페이스를 분리하는 데 있다. 내부 state는 가능한 한 풍부하게 유지하고, 실제 상호작용이 요구할 때만 discrete token·clock·modality 같은 형식으로 투영하는 것이 더 자연스러운 계산 구조일 수 있다.'),
              ('v1.1에서 강조했던 null-token + gated latent는 여기서 더 정확한 위치를 가집니다. 전체 architecture 자체가 아니라, <b>token bottleneck과 token-time coupling을 동시에 느슨하게 만드는 최소 구현</b>입니다.',
               'Null-token + gated latent는 전체 architecture 자체가 아니라, <b>token bottleneck과 token-time coupling을 동시에 느슨하게 만드는 최소 구현</b>으로 볼 수 있습니다.'),
              ('<h2>v1.2는 technical mechanism보다 먼저 architectural question을 세운다.</h2><p>Position paper v1.2는 representation space와 interface bottleneck의 구분을 중심 thesis로 올리고, null-token recurrence와 event-driven multi-stream state를 그 thesis를 검증하는 concrete mechanism으로 재배치합니다.</p>',
               '<h2>기술적 가설과 구현 방법을 position paper에서 더 구체적으로 다룬다.</h2><p>Position paper에서는 representation space와 interface bottleneck의 관계를 중심으로, null-token recurrence와 event-driven multi-stream state를 구체적인 구현 후보와 검증 과제로 다룹니다.</p>'),
            ],
            'research/beyond-token-time/content-en.html': [
              ('The central hypothesis is not a new hidden-thinking trick. It is that internal representation and external interface should be separated, with discrete tokens, fixed clocks, and modality-specific serialization applied only when interaction requires them.',
               'The central hypothesis is that internal representation and external interface should be separated. Internal state can remain rich, while discrete tokens, clocks, and modality-specific serialization are applied only when interaction requires them.'),
              ('The null-token + gated-latent mechanism introduced in v1.1 now has a clearer role. It is not the architecture itself; it is a minimal way to relax both the <b>token bottleneck</b> and the coupling between token time and compute time.',
               'The null-token + gated-latent mechanism is not the architecture itself; it is a minimal way to relax both the <b>token bottleneck</b> and the coupling between token time and compute time.'),
              ('<h2>v1.2 puts the architectural question before the mechanism.</h2><p>The v1.2 position paper promotes representation-space versus interface bottleneck to the central thesis, then treats null-token recurrence and event-driven multi-stream state as concrete mechanisms for testing that thesis.</p>',
               '<h2>The position paper develops the architectural hypothesis and its concrete tests.</h2><p>The paper centers the distinction between representation space and interface bottlenecks, then treats null-token recurrence and event-driven multi-stream state as concrete mechanisms for testing that hypothesis.</p>'),
            ],
            'research/beyond-token-time/index.html': [
              ('<a class="pdfbtn" href="./paper-v1.2.pdf">Paper v1.2</a><a class="round oldpaper" href="./paper-v1.1.pdf">v1.1</a><a class="round oldpaper" href="./paper-v1.0.pdf">v1.0</a><a class="round" href="./paper-versions.html">Versions</a>',
               '<a class="pdfbtn" href="./paper.pdf">Paper</a><a class="round" href="./paper-versions.html">Versions</a>'),
              ("content-'+lang+'.html?v=5", "content-'+lang+'.html?v=6"),
            ],
          }

          for filename, pairs in replacements.items():
              p = Path(filename)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {filename}: {old[:80]}')
                  s = s.replace(old, new)
              p.write_text(s)

          Path('.github/workflows/polish-btt-reader.yml').unlink()
          PY
      - name: Commit polished copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/beyond-token-time/content-ko.html research/beyond-token-time/content-en.html research/beyond-token-time/index.html .github/workflows/polish-btt-reader.yml
          git commit -m 'Polish Beyond Token Time for first-time readers'
          git push origin HEAD:master
